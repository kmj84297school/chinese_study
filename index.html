<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국어 단어 퀴즈</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --primary:#3b6ef5;
    --primary-dark:#2c54c4;
    --text:#222;
    --muted:#6b7280;
    --border:#e3e7ef;
    --correct:#1ca672;
    --wrong:#e5484d;
    --selected:#dbe6ff;
    --shadow:0 6px 20px rgba(30,50,90,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:16px 14px 48px;
  }
  header h1{
    text-align:center;
    font-size:1.5rem;
    margin:8px 0 16px;
  }
  .mode-tag{
    display:block;
    text-align:center;
    font-size:.85rem;
    color:var(--muted);
    margin-top:-10px;
    margin-bottom:14px;
  }
  .mode-tag b{color:var(--primary);}

  /* 통계 */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    background:var(--card);
    border-radius:14px;
    padding:12px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .stat{
    text-align:center;
    padding:6px 2px;
  }
  .stat .num{
    display:block;
    font-size:1.15rem;
    font-weight:700;
    color:var(--primary);
  }
  .stat .lbl{
    display:block;
    font-size:.72rem;
    color:var(--muted);
    margin-top:2px;
  }

  /* 카드 */
  .card{
    background:var(--card);
    border-radius:18px;
    padding:22px 18px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .qnum{
    font-size:.8rem;
    color:var(--muted);
    margin-bottom:10px;
  }
  .hanzi{
    text-align:center;
    font-size:3.6rem;
    font-weight:700;
    letter-spacing:2px;
    margin:6px 0 22px;
    word-break:keep-all;
  }
  .section-label{
    font-size:.82rem;
    color:var(--muted);
    margin:0 0 8px;
    font-weight:600;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:18px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-size:1.05rem;
    cursor:pointer;
    transition:.15s;
    color:var(--text);
  }
  .opt:hover:not(:disabled){border-color:var(--primary);}
  .opt .badge{
    flex:none;
    width:24px;height:24px;
    border-radius:50%;
    background:#eef1f7;
    color:var(--muted);
    font-size:.85rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.selected{
    border-color:var(--primary);
    background:var(--selected);
  }
  .opt.selected .badge{background:var(--primary);color:#fff;}
  .opt.correct{border-color:var(--correct);background:#e7f7f0;}
  .opt.correct .badge{background:var(--correct);color:#fff;}
  .opt.wrong{border-color:var(--wrong);background:#fdeced;}
  .opt.wrong .badge{background:var(--wrong);color:#fff;}
  .opt:disabled{cursor:default;}

  .meaning-input{
    width:100%;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    font-size:1.05rem;
    margin-bottom:16px;
    outline:none;
    transition:.15s;
  }
  .meaning-input:focus{border-color:var(--primary);}
  .meaning-input:disabled{background:#f7f8fa;color:#555;}

  .btn{
    display:inline-block;
    width:100%;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#b9c6e8;cursor:default;}
  .btn-next{background:var(--correct);color:#fff;}
  .btn-next:hover{filter:brightness(.95);}
  .btn-ghost{
    background:#eef1f7;color:#374151;
  }
  .btn-ghost:hover{background:#e2e7f1;}
  .btn-amber{background:#f59e0b;color:#fff;}
  .btn-amber:hover{background:#d97706;}

  /* 재시험 선택 버튼 묶음 */
  .retry-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .retry-actions .btn{flex:1;}

  /* 결과 */
  .result{
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
    font-size:.95rem;
  }
  .result.ok{background:#e7f7f0;border:1.5px solid var(--correct);}
  .result.no{background:#fdeced;border:1.5px solid var(--wrong);}
  .result .head{font-size:1.15rem;font-weight:800;margin-bottom:6px;}
  .result.ok .head{color:var(--correct);}
  .result.no .head{color:var(--wrong);}
  .result .row{margin:2px 0;}
  .result .row b{color:#111;}

  .done-msg{
    text-align:center;
    padding:34px 10px;
    font-size:1.2rem;
    font-weight:700;
    color:var(--primary);
  }
  .done-msg small{
    display:block;
    font-weight:400;
    font-size:.9rem;
    color:var(--muted);
    margin-top:8px;
  }

  /* 하단 컨트롤 */
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .controls .btn{font-size:.92rem;padding:12px;}
  .controls .full{grid-column:1 / -1;}

  .hidden{display:none !important;}

  /* 모달 */
  .modal-bg{
    position:fixed;inset:0;
    background:rgba(20,30,55,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
    padding:0;
  }
  .modal{
    background:#fff;
    width:100%;
    max-width:560px;
    max-height:80vh;
    border-radius:18px 18px 0 0;
    padding:18px 16px 26px;
    overflow-y:auto;
  }
  .modal h2{font-size:1.1rem;margin:0 0 4px;}
  .modal .sub{color:var(--muted);font-size:.85rem;margin:0 0 14px;}
  .list-item{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .list-item .hz{font-size:1.25rem;font-weight:700;min-width:54px;}
  .list-item .info{flex:1;min-width:0;}
  .list-item .py{font-size:.9rem;color:var(--primary);}
  .list-item .mn{font-size:.85rem;color:var(--muted);}
  .list-item .mini{
    flex:none;border:none;background:#eef1f7;color:#374151;
    border-radius:8px;padding:7px 11px;font-size:.82rem;font-weight:700;cursor:pointer;
  }
  .list-item .mini:hover{background:#e2e7f1;}
  .empty{text-align:center;color:var(--muted);padding:26px 0;}
  .modal .close{
    width:100%;margin-top:8px;background:var(--primary);color:#fff;
    border:none;border-radius:12px;padding:13px;font-size:1rem;font-weight:700;cursor:pointer;
  }

  @media (min-width:600px){
    .modal-bg{align-items:center;}
    .modal{border-radius:18px;}
  }
  @media (max-width:360px){
    .hanzi{font-size:3rem;}
    .stat .num{font-size:1rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>중국어 단어 퀴즈</h1>
  </header>
  <span class="mode-tag" id="modeTag"></span>

  <!-- 통계 -->
  <section class="stats" id="stats">
    <div class="stat"><span class="num" id="stTotal">0</span><span class="lbl">전체 단어</span></div>
    <div class="stat"><span class="num" id="stRemain">0</span><span class="lbl">남은 단어</span></div>
    <div class="stat"><span class="num" id="stSolved">0</span><span class="lbl">맞힌 단어</span></div>
    <div class="stat"><span class="num" id="stRetry">0</span><span class="lbl">재시험 단어</span></div>
    <div class="stat"><span class="num" id="stExcl">0</span><span class="lbl">제외 단어</span></div>
    <div class="stat"><span class="num" id="stRate">0%</span><span class="lbl">정답률</span></div>
  </section>

  <!-- 퀴즈 카드 -->
  <section class="card" id="quizCard">
    <div class="qnum" id="qnum"></div>
    <div class="hanzi" id="hanzi">汉</div>

    <p class="section-label">병음을 고르세요</p>
    <div class="options" id="options"></div>

    <p class="section-label">뜻을 입력하세요</p>
    <input type="text" class="meaning-input" id="meaningInput" placeholder="뜻을 입력하고 Enter" autocomplete="off">

    <div class="result hidden" id="result"></div>

    <button class="btn btn-primary" id="submitBtn">제출</button>
    <button class="btn btn-next hidden" id="nextBtn" style="margin-top:8px;">다음 문제 →</button>
    <!-- 오답 후 재시험 여부 선택 버튼 (동적으로 내용 채워짐) -->
    <div class="retry-actions hidden" id="retryActions"></div>
  </section>

  <!-- 완료 메시지 카드 -->
  <section class="card hidden" id="doneCard">
    <div class="done-msg" id="doneMsg"></div>
  </section>

  <!-- 하단 컨트롤 -->
  <section class="controls">
    <button class="btn btn-primary" id="retryStartBtn">재시험 시작</button>
    <button class="btn btn-ghost" id="normalBtn">일반 퀴즈로</button>
    <button class="btn btn-ghost" id="retryListBtn">재시험 목록</button>
    <button class="btn btn-ghost" id="exclListBtn">제외 목록</button>
    <button class="btn btn-ghost full" id="resetBtn">기록 초기화</button>
  </section>
</div>

<!-- 모달 -->
<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p class="sub" id="modalSub"></p>
    <div id="modalBody"></div>
    <button class="close" id="modalClose">닫기</button>
  </div>
</div>

/* 기본 제외 단어 (처음 한 번만 자동 제외 목록에 추가) */
const DEFAULT_EXCLUDED_HANZI = ["眼保健操","紫禁城","外孙女","兵马俑","故宫","课间操","抱拳"];

const STORAGE_KEY = "chineseQuizState_v1";

/* =========================================================
   상태 관리
   ========================================================= */
function defaultExcludedIdx(){
  const set = [];
  DEFAULT_EXCLUDED_HANZI.forEach(h=>{
    const i = WORDS.findIndex(w=>w.hanzi===h);
    if(i>=0 && !set.includes(i)) set.push(i);
  });
  return set;
}

function freshState(){
  return {
    solved:[],            // 맞힌 단어 인덱스
    retry:[],             // 재시험 목록 인덱스
    excluded:defaultExcludedIdx(), // 제외 단어 인덱스
    total:0,              // 총 풀이 수
    correct:0,            // 정답 수
    wrong:0               // 오답 수
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const s = JSON.parse(raw);
    // 안전 보정
    s.solved   = Array.isArray(s.solved)?s.solved:[];
    s.retry    = Array.isArray(s.retry)?s.retry:[];
    s.excluded = Array.isArray(s.excluded)?s.excluded:[];
    s.total    = s.total|0;
    s.correct  = s.correct|0;
    s.wrong    = s.wrong|0;
    return s;
  }catch(e){
    return freshState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

/* 런타임 변수 */
let mode = "normal";          // "normal" | "retry"
let currentIndex = null;      // 현재 출제 단어의 WORDS 인덱스
let currentOptions = [];      // [{pinyin, correct}]
let selectedOption = null;    // 선택한 보기 인덱스
let answered = false;
let questionCounter = 0;

/* =========================================================
   유틸
   ========================================================= */
function $(id){ return document.getElementById(id); }
function addToSet(arr, v){ if(!arr.includes(v)) arr.push(v); }
function removeFrom(arr, v){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); }
function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function normalize(s){ return (s||"").replace(/\s+/g,"").toLowerCase(); }

/* 일반/재시험 출제 풀 */
function getPool(m){
  const pool=[];
  if(m==="retry"){
    state.retry.forEach(i=>{ if(!state.excluded.includes(i)) pool.push(i); });
  }else{
    for(let i=0;i<WORDS.length;i++){
      if(state.solved.includes(i)) continue;
      if(state.retry.includes(i)) continue;
      if(state.excluded.includes(i)) continue;
      pool.push(i);
    }
  }
  return pool;
}

/* =========================================================
   통계 렌더링
   ========================================================= */
function renderStats(){
  $("stTotal").textContent  = WORDS.length;
  $("stRemain").textContent = getPool("normal").length;
  $("stSolved").textContent = state.solved.length;
  $("stRetry").textContent  = state.retry.length;
  $("stExcl").textContent   = state.excluded.length;
  const rate = state.total>0 ? Math.round(state.correct/state.total*100) : 0;
  $("stRate").textContent   = rate + "%";
  $("modeTag").innerHTML = "현재 모드: <b>" + (mode==="retry"?"재시험":"일반 퀴즈") + "</b>";
}

/* =========================================================
   문제 출제
   ========================================================= */
function buildOptions(){
  const word = WORDS[currentIndex];
  const correct = {pinyin:word.pinyin, correct:true};
  // 정답과 다른 pinyin 후보(중복 제거)에서 4개 랜덤
  const seen = new Set([word.pinyin]);
  const distract = [];
  const candidates = shuffle(WORDS);
  for(const w of candidates){
    if(distract.length===4) break;
    if(!seen.has(w.pinyin)){
      seen.add(w.pinyin);
      distract.push({pinyin:w.pinyin, correct:false});
    }
  }
  currentOptions = shuffle([correct, ...distract]);
}

function renderQuestion(){
  renderStats();
  const pool = getPool(mode);

  if(pool.length===0){
    // 출제할 단어 없음 → 완료 메시지
    $("quizCard").classList.add("hidden");
    $("doneCard").classList.remove("hidden");
    if(mode==="retry"){
      $("doneMsg").innerHTML = "🎉 재시험할 단어가 없습니다<small>틀린 문제가 생기면 여기에서 다시 풀 수 있어요.</small>";
    }else{
      $("doneMsg").innerHTML = "🎉 일반 퀴즈 완료!<small>모든 일반 단어를 다 맞혔어요. 재시험을 풀어보세요.</small>";
    }
    return;
  }

  $("doneCard").classList.add("hidden");
  $("quizCard").classList.remove("hidden");

  // 상태 초기화
  answered = false;
  selectedOption = null;
  questionCounter++;

  currentIndex = pool[Math.floor(Math.random()*pool.length)];
  buildOptions();

  const word = WORDS[currentIndex];
  $("qnum").textContent = (mode==="retry"?"[재시험] ":"") + "문제 " + questionCounter + " · 남은 " + pool.length + "개";
  $("hanzi").textContent = word.hanzi;

  // 보기 렌더
  const wrap = $("options");
  wrap.innerHTML = "";
  currentOptions.forEach((opt, idx)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="badge">'+(idx+1)+'</span><span>'+opt.pinyin+'</span>';
    b.addEventListener("click", ()=>selectOption(idx));
    wrap.appendChild(b);
  });

  // 입력/버튼 초기화
  const mi = $("meaningInput");
  mi.value = "";
  mi.disabled = false;
  $("result").classList.add("hidden");
  $("result").className = "result hidden";
  $("submitBtn").disabled = false;
  $("submitBtn").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  $("retryActions").classList.add("hidden");
  $("retryActions").innerHTML = "";
  mi.focus();
}

function selectOption(idx){
  if(answered) return;
  selectedOption = idx;
  const btns = $("options").querySelectorAll(".opt");
  btns.forEach((b,i)=> b.classList.toggle("selected", i===idx));
}

/* =========================================================
   채점
   ========================================================= */
function checkMeaning(input, meanings){
  const u = normalize(input);
  if(!u) return false;
  return meanings.some(m=>{
    const mm = normalize(m);
    return mm && (u.includes(mm) || mm.includes(u));
  });
}

function submit(){
  if(answered) return;
  if(selectedOption===null){
    // 병음 미선택 안내
    const mi=$("meaningInput");
    mi.placeholder = "먼저 병음을 선택하세요!";
    $("options").querySelectorAll(".opt").forEach(b=>{
      b.animate([{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"translateX(0)"}],{duration:150});
    });
    return;
  }

  answered = true;
  const word = WORDS[currentIndex];
  const pinyinOK  = currentOptions[selectedOption].correct;
  const meaningOK = checkMeaning($("meaningInput").value, word.meaning);
  const isCorrect = pinyinOK && meaningOK;

  // 통계
  state.total++;
  if(isCorrect) state.correct++; else state.wrong++;

  // 정답인 경우만 즉시 상태 갱신 (오답은 사용자 선택 후 갱신)
  if(isCorrect){
    if(mode==="normal"){
      addToSet(state.solved, currentIndex);
    }else{
      removeFrom(state.retry, currentIndex);
      addToSet(state.solved, currentIndex);
    }
  }
  saveState();

  // 보기 정답/오답 시각화
  const btns = $("options").querySelectorAll(".opt");
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(currentOptions[i].correct) b.classList.add("correct");
    else if(i===selectedOption) b.classList.add("wrong");
  });

  // 입력/제출 버튼 잠금
  $("meaningInput").disabled = true;
  $("submitBtn").classList.add("hidden");

  // 결과 표시
  const r = $("result");
  r.className = "result " + (isCorrect?"ok":"no");
  r.innerHTML =
    '<div class="head">'+(isCorrect?"⭕ 정답!":"❌ 오답")+'</div>' +
    '<div class="row">병음 '+(pinyinOK?"⭕":"❌")+' · 뜻 '+(meaningOK?"⭕":"❌")+'</div>' +
    '<div class="row"><b>정답 병음:</b> '+word.pinyin+'</div>' +
    '<div class="row"><b>정답 뜻:</b> '+word.meaning.join(", ")+'</div>';

  if(isCorrect){
    // 정답 → 다음 문제 버튼
    $("nextBtn").classList.remove("hidden");
  }else{
    // 오답 → 재시험 여부 사용자 선택
    const ra = $("retryActions");
    ra.classList.remove("hidden");
    if(mode==="normal"){
      const alreadyInRetry = state.retry.includes(currentIndex);
      if(alreadyInRetry){
        ra.innerHTML =
          '<button class="btn btn-ghost" id="raSkip">추가하지 않기</button>' +
          '<button class="btn btn-amber" id="raAdd" disabled style="opacity:.5;cursor:default">이미 재시험에 있음</button>';
      }else{
        ra.innerHTML =
          '<button class="btn btn-ghost" id="raSkip">추가하지 않기</button>' +
          '<button class="btn btn-amber" id="raAdd">재시험 목록에 추가</button>';
        $("raAdd").addEventListener("click", ()=>resolveNormal(true));
      }
      $("raSkip").addEventListener("click", ()=>resolveNormal(false));
    }else{
      // retry 모드 오답: 유지 or 제거
      ra.innerHTML =
        '<button class="btn btn-amber" id="raKeep">재시험 목록에 유지</button>' +
        '<button class="btn btn-ghost" id="raRemove">재시험 목록에서 제거</button>';
      $("raKeep").addEventListener("click", ()=>resolveRetryMode(true));
      $("raRemove").addEventListener("click", ()=>resolveRetryMode(false));
    }
  }

  renderStats();
}

/* =========================================================
   오답 후 재시험 여부 처리
   ========================================================= */
function resolveNormal(addToList){
  if(addToList) addToSet(state.retry, currentIndex);
  saveState();
  renderStats();
  renderQuestion();
}

function resolveRetryMode(keep){
  if(!keep) removeFrom(state.retry, currentIndex);
  saveState();
  renderStats();
  renderQuestion();
}

/* =========================================================
   제외 / 모드 전환 / 초기화
   ========================================================= */
function excludeCurrent(){
  if(currentIndex===null) return;
  addToSet(state.excluded, currentIndex);
  removeFrom(state.retry, currentIndex);
  removeFrom(state.solved, currentIndex);
  saveState();
  renderQuestion();
}

function startMode(m){
  mode = m;
  questionCounter = 0;
  renderQuestion();
}

function resetAll(){
  if(!confirm("모든 기록을 삭제하고 처음부터 시작할까요?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = freshState();
  saveState();
  mode = "normal";
  questionCounter = 0;
  renderQuestion();
}

/* =========================================================
   모달 (목록 보기)
   ========================================================= */
function openModal(title, sub, bodyHtml){
  $("modalTitle").textContent = title;
  $("modalSub").textContent = sub;
  $("modalBody").innerHTML = bodyHtml;
  $("modalBg").classList.remove("hidden");
}
function closeModal(){ $("modalBg").classList.add("hidden"); }

function listHtml(indices, type){
  if(indices.length===0){
    return '<div class="empty">목록이 비어 있습니다.</div>';
  }
  return indices.map(i=>{
    const w = WORDS[i];
    const btn = type==="excluded"
      ? '<button class="mini" data-restore="'+i+'">복원</button>'
      : '';
    return '<div class="list-item">' +
             '<div class="hz">'+w.hanzi+'</div>' +
             '<div class="info"><div class="py">'+w.pinyin+'</div><div class="mn">'+w.meaning.join(", ")+'</div></div>' +
             btn +
           '</div>';
  }).join("");
}

function showRetryList(){
  openModal("재시험 목록", "틀려서 다시 풀어야 하는 단어들입니다.", listHtml(state.retry, "retry"));
}
function showExcludedList(){
  openModal("제외 단어 목록", "퀴즈에서 제외된 단어들입니다. 복원하면 다시 출제됩니다.", listHtml(state.excluded, "excluded"));
}

/* =========================================================
   이벤트 바인딩
   ========================================================= */
$("submitBtn").addEventListener("click", submit);
$("nextBtn").addEventListener("click", renderQuestion);
$("retryStartBtn").addEventListener("click", ()=>startMode("retry"));
$("normalBtn").addEventListener("click", ()=>startMode("normal"));
$("retryListBtn").addEventListener("click", showRetryList);
$("exclListBtn").addEventListener("click", showExcludedList);
$("resetBtn").addEventListener("click", resetAll);
$("modalClose").addEventListener("click", closeModal);
$("modalBg").addEventListener("click",(e)=>{ if(e.target===$("modalBg")) closeModal(); });

// 모달 내 복원 버튼 (이벤트 위임)
$("modalBody").addEventListener("click",(e)=>{
  const t=e.target;
  if(t.dataset && t.dataset.restore!==undefined){
    const i=parseInt(t.dataset.restore,10);
    removeFrom(state.excluded, i);
    saveState();
    showExcludedList(); // 목록 새로고침
    renderStats();
  }
});

// Enter 제출 / 다음
$("meaningInput").addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){ e.preventDefault(); submit(); }
});
document.addEventListener("keydown",(e)=>{
  // 정답인 경우만 Enter로 다음 문제(오답은 버튼으로 직접 선택해야 함)
  if(e.key==="Enter" && answered && !$("nextBtn").classList.contains("hidden") && $("retryActions").classList.contains("hidden")){
    renderQuestion();
  }
  // 숫자키 1~5로 보기 선택
  if(!answered && /^[1-5]$/.test(e.key)){
    const idx=parseInt(e.key,10)-1;
    if(idx<currentOptions.length) selectOption(idx);
  }
});

// 제외하기 버튼을 카드 하단 컨트롤 위에 동적 삽입
(function addExcludeButton(){
  const card=$("quizCard");
  const btn=document.createElement("button");
  btn.className="btn btn-ghost";
  btn.style.marginTop="8px";
  btn.textContent="이 단어 제외하기";
  btn.addEventListener("click", excludeCurrent);
  card.appendChild(btn);
})();

/* 시작 */
renderQuestion();
</script>
</body>
</html>
